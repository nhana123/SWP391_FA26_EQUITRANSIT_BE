<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1347" viewBox="0 0 1640 1347"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eaf0f4" stroke-width=".7"/></pattern><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26343d"/></marker><marker id="open" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#26343d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="145" width="1600" height="1137" fill="url(#grid)"/><g font-family="Arial, sans-serif" fill="#182f40"><text x="45" y="43" font-size="16" text-anchor="start" font-weight="bold" fill="#245c78">EQUITRANSIT / DRIVER</text><text x="45" y="82" font-size="27" text-anchor="start" font-weight="bold">Record Intermediate Handover or Final Delivery</text><text x="45" y="114" font-size="14" text-anchor="start" >Assigned DRIVER; current leg has departed. Signature and photo file keys were uploaded through HandoverFileController.</text><line x1="121" y1="229" x2="121" y2="1253" stroke="#6d7a83" stroke-width="1.2" stroke-dasharray="6 5"/><circle cx="121" cy="165" r="9" fill="#87d3f4" stroke="#344c5c"/><line x1="121" y1="174" x2="121" y2="199" stroke="#344c5c" stroke-width="1.7"/><line x1="105" y1="185" x2="137" y2="185" stroke="#344c5c" stroke-width="1.7"/><line x1="121" y1="199" x2="106" y2="218" stroke="#344c5c" stroke-width="1.7"/><line x1="121" y1="199" x2="136" y2="218" stroke="#344c5c" stroke-width="1.7"/><text x="121" y="243" font-size="16" text-anchor="middle" >Driver</text><line x1="476" y1="229" x2="476" y2="1253" stroke="#6d7a83" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="308" y="160" width="336" height="64" fill="#87d3f4" stroke="#455d6a" stroke-width="1.5"/><text x="476" y="197" font-size="17" text-anchor="middle" font-weight="bold">: TripHandoverView</text><line x1="951" y1="229" x2="951" y2="1253" stroke="#6d7a83" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="783" y="160" width="336" height="64" fill="#87d3f4" stroke="#455d6a" stroke-width="1.5"/><text x="951" y="197" font-size="17" text-anchor="middle" font-weight="bold">: DriverHandoverController</text><line x1="1416" y1="229" x2="1416" y2="1253" stroke="#6d7a83" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="1248" y="160" width="336" height="64" fill="#87d3f4" stroke="#455d6a" stroke-width="1.5"/><text x="1416" y="197" font-size="17" text-anchor="middle" font-weight="bold">: TripHandoverService</text><rect x="45" y="532" width="1550" height="660" fill="none" stroke="#283a46" stroke-width="1.5"/><path d="M45 532 h62 v21 l-11 10 H45Z" fill="white" stroke="#283a46"/><text x="56" y="553" font-size="15" text-anchor="start" font-weight="bold">alt</text><text x="128" y="555" font-size="15" text-anchor="start" >[Intermediate custody transfer]</text><line x1="45" y1="851" x2="1595" y2="851" stroke="#283a46" stroke-dasharray="8 5"/><text x="128" y="876" font-size="15" text-anchor="start" >[Last leg; final delivery to authorized receiver]</text><rect x="395" y="262" width="1190" height="32" fill="#fffdf3" stroke="#d9d7c8"/><text x="408" y="283" font-size="13" text-anchor="start" >GET /api/driver/legs/{legId}/handovers</text><rect x="470" y="322" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="364" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="406" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="327" x2="476" y2="327" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="317" font-size="15" text-anchor="middle" >1. Open handover history for assigned leg</text><line x1="476" y1="369" x2="951" y2="369" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="359" font-size="15" text-anchor="middle" >getHandovers(legId)</text><line x1="951" y1="411" x2="1416" y2="411" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="401" font-size="15" text-anchor="middle" >getHandoversForLeg(legId)</text><line x1="1416" y1="453" x2="951" y2="453" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="443" font-size="15" text-anchor="middle" >List&lt;TripHandoverResponse&gt;</text><line x1="951" y1="495" x2="476" y2="495" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="485" font-size="15" text-anchor="middle" >List&lt;TripHandoverResponse&gt;</text><rect x="395" y="581" width="1190" height="32" fill="#fffdf3" stroke="#d9d7c8"/><text x="408" y="602" font-size="13" text-anchor="start" >POST /api/driver/legs/{legId}/intermediate-handover; next leg stays CONFIRMED</text><rect x="470" y="641" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="683" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="725" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="646" x2="476" y2="646" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="636" font-size="15" text-anchor="middle" >2. Record transfer to next carrier or quarantine</text><line x1="476" y1="688" x2="951" y2="688" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="678" font-size="15" text-anchor="middle" >recordIntermediate(legId, request)</text><line x1="951" y1="730" x2="1416" y2="730" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="720" font-size="15" text-anchor="middle" >recordIntermediateByDriver(legId, request)</text><line x1="1416" y1="772" x2="951" y2="772" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="762" font-size="15" text-anchor="middle" >201 TripHandoverResponse</text><line x1="951" y1="814" x2="476" y2="814" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="804" font-size="15" text-anchor="middle" >201 TripHandoverResponse</text><rect x="395" y="917" width="1190" height="32" fill="#fffdf3" stroke="#d9d7c8"/><text x="408" y="938" font-size="13" text-anchor="start" >POST /api/driver/legs/{legId}/final-delivery</text><rect x="470" y="977" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="1019" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="1061" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="982" x2="476" y2="982" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="972" font-size="15" text-anchor="middle" >3. Record final delivery with signature and photo</text><line x1="476" y1="1024" x2="951" y2="1024" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="1014" font-size="15" text-anchor="middle" >recordFinalDelivery(legId, request)</text><line x1="951" y1="1066" x2="1416" y2="1066" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="1056" font-size="15" text-anchor="middle" >recordFinalDeliveryByDriver(legId, request)</text><line x1="1416" y1="1108" x2="951" y2="1108" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="1098" font-size="15" text-anchor="middle" >200 OperationalCompletionReceipt [DELIVERED]</text><line x1="951" y1="1150" x2="476" y2="1150" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="1140" font-size="15" text-anchor="middle" >200 OperationalCompletionReceipt [DELIVERED]</text><text x="45" y="1303" font-size="14" text-anchor="start" >Final delivery requires QUARANTINE_RELEASE clearance, receiver authority and files. Manager closes DELIVERED orders separately.</text><text x="45" y="1329" font-size="12" text-anchor="start" fill="#5b6c77">UI view names are conceptual boundaries; Controller / Service names and methods follow the Backend source.</text></g></svg>