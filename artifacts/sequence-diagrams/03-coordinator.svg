ke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="1427" font-size="15" text-anchor="middle" >reserveFlight(orderId, planId, legId, body)</text><line x1="1416" y1="1479" x2="951" y2="1479" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="1469" font-size="15" text-anchor="middle" >PlanDetailResponse</text><line x1="951" y1="1521" x2="476" y2="1521" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="1511" font-size="15" text-anchor="middle" >PlanDetailResponse</text><rect x="395" y="1642" width="1190" height="32" fill="#fffdf3" stroke="#d9d7c8"/><text x="408" y="1663" font-size="13" text-anchor="start" >POST /api/transport-orders/{orderId}/plans/{planId}/confirm</text><rect x="470" y="1702" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="1744" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="1786" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="1707" x2="476" y2="1707" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="1697" font-size="15" text-anchor="middle" >6. Confirm operational plan</text><line x1="476" y1="1749" x2="951" y2="1749" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="1739" font-size="15" text-anchor="middle" >confirm(orderId, planId, PlanConfirmRequest)</text><line x1="951" y1="1791" x2="1416" y2="1791" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="1781" font-size="15" text-anchor="middle" >confirm(orderId, planId, PlanConfirmRequest)</text><line x1="1416" y1="1833" x2="951" y2="1833" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="1823" font-size="15" text-anchor="middle" >PlanDetailResponse [CONFIRMED]</text><line x1="951" y1="1875" x2="476" y2="1875" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="1865" font-size="15" text-anchor="middle" >PlanDetailResponse [CONFIRMED]</text><text x="45" y="2028" font-size="14" text-anchor="start" >Required quarantine reservations and insurance must also pass confirmation checks. Failed checks return 409.</text><text x="45" y="2054" font-size="12" text-anchor="start" fill="#5b6c77">UI view names are conceptual boundaries; Controller / Service names and methods follow the Backend source.</text></g></svg>