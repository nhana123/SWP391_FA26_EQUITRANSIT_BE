" x2="1416" y2="730" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="720" font-size="15" text-anchor="middle" >createDraft(orderId, PlanDraftRequest)</text><line x1="1416" y1="772" x2="951" y2="772" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="762" font-size="15" text-anchor="middle" >PlanDetailResponse [DRAFT]</text><line x1="951" y1="814" x2="476" y2="814" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="804" font-size="15" text-anchor="middle" >PlanDetailResponse [DRAFT]</text><rect x="470" y="938" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="980" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="1022" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="943" x2="476" y2="943" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="933" font-size="15" text-anchor="middle" >3. Assign vehicle and driver to ROAD leg</text><line x1="476" y1="985" x2="951" y2="985" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="975" font-size="15" text-anchor="middle" >assignRoad(orderId, planId, legId, body)</text><line x1="951" y1="1027" x2="1416" y2="1027" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="1017" font-size="15" text-anchor="middle" >assignRoad(orderId, planId, legId, body)</text><line x1="1416" y1="1069" x2="951" y2="1069" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="1059" font-size="15" text-anchor="middle" >PlanDetailResponse</text><line x1="951" y1="1111" x2="476" y2="1111" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="1101" font-size="15" text-anchor="middle" >PlanDetailResponse</text><rect x="470" y="1143" width="12" height="177" fill="#