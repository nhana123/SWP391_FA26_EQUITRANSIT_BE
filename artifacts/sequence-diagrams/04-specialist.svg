<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1998" viewBox="0 0 1640 1998"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eaf0f4" stroke-width=".7"/></pattern><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26343d"/></marker><marker id="open" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#26343d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="145" width="1600" height="1788" fill="url(#grid)"/><g font-family="Arial, sans-serif" fill="#182f40"><text x="45" y="43" font-size="16" text-anchor="start" font-weight="bold" fill="#245c78">EQUITRANSIT / SPECIALIST</text><text x="45" y="82" font-size="27" text-anchor="start" font-weight="bold">Review Documents &amp; Clear Compliance Phase</text><text x="45" y="114" font-size="14" text-anchor="start" >Assigned SPECIALIST. Customer has submitted evidence, or Specialist uploads on their behalf.</text><line x1="121" y1="229" x2="121" y2="1904" stroke="#6d7a83" stroke-width="1.2" stroke-dasharray="6 5"/><circle cx="121" cy="165" r="9" fill="#87d3f4" stroke="#344c5c"/><line x1="121" y1="174" x2="121" y2="199" stroke="#344c5c" stroke-width="1.7"/><line x1="105" y1="185" x2="137" y2="185" stroke="#344c5c" stroke-width="1.7"/><line x1="121" y1="199" x2="106" y2="218" stroke="#344c5c" stroke-width="1.7"/><line x1="121" y1="199" x2="136" y2="218" stroke="#344c5c" stroke-width="1.7"/><text x="121" y="243" font-size="16" text-anchor="middle" >Specialist</text><line x1="476" y1="229" x2="476" y2="1904" stroke="#6d7a83" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="308" y="160" width="336" height="64" fill="#87d3f4" stroke="#455d6a" stroke-width="1.5"/><text x="476" y="197" font-size="17" text-anchor="middle" font-weight="bold">: ComplianceWorkspaceView</text><line x1="951" y1="229" x2="951" y2="1904" stroke="#6d7a83" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="783" y="160" width="336" height="64" fill="#87d3f4" stroke="#455d6a" stroke-width="1.5"/><text x="951" y="197" font-size="17" text-anchor="middle" font-weight="bold">: ComplianceController</text><line x1="1416" y1="229" x2="1416" y2="1904" stroke="#6d7a83" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="1248" y="160" width="336" height="64" fill="#87d3f4" stroke="#455d6a" stroke-width="1.5"/><text x="1416" y="197" font-size="17" text-anchor="middle" font-weight="bold">: ComplianceService</text><rect x="45" y="532" width="1550" height="324" fill="none" stroke="#283a46" stroke-width="1.5"/><path d="M45 532 h62 v21 l-11 10 H45Z" fill="white" stroke="#283a46"/><text x="56" y="553" font-size="15" text-anchor="start" font-weight="bold">opt</text><text x="128" y="555" font-size="15" text-anchor="start" >[Specialist submits a document for the customer]</text><rect x="45" y="886" width="1550" height="324" fill="none" stroke="#283a46" stroke-width="1.5"/><path d="M45 886 h62 v21 l-11 10 H45Z" fill="white" stroke="#283a46"/><text x="56" y="907" font-size="15" text-anchor="start" font-weight="bold">loop</text><text x="128" y="909" font-size="15" text-anchor="start" >[For each current submission requiring review]</text><rect x="45" y="1240" width="1550" height="603" fill="none" stroke="#283a46" stroke-width="1.5"/><path d="M45 1240 h62 v21 l-11 10 H45Z" fill="white" stroke="#283a46"/><text x="56" y="1261" font-size="15" text-anchor="start" font-weight="bold">alt</text><text x="128" y="1263" font-size="15" text-anchor="start" >[All required documents approved and other clearance checks pass]</text><line x1="45" y1="1559" x2="1595" y2="1559" stroke="#283a46" stroke-dasharray="8 5"/><text x="128" y="1584" font-size="15" text-anchor="start" >[Evidence is rejected, missing, expired or otherwise invalid]</text><rect x="395" y="262" width="1190" height="32" fill="#fffdf3" stroke="#d9d7c8"/><text x="408" y="283" font-size="13" text-anchor="start" >GET /api/transport-orders/{order}/compliance?phase=...&amp;bootstrap=true</text><rect x="470" y="322" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="364" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="406" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="327" x2="476" y2="327" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="317" font-size="15" text-anchor="middle" >1. Open compliance checklist</text><line x1="476" y1="369" x2="951" y2="369" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="359" font-size="15" text-anchor="middle" >overview(order, phase, page, size, true)</text><line x1="951" y1="411" x2="1416" y2="411" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="401" font-size="15" text-anchor="middle" >overview(order, phase, page, size, true)</text><line x1="1416" y1="453" x2="951" y2="453" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="443" font-size="15" text-anchor="middle" >ComplianceOverview [requirements + files + feedback]</text><line x1="951" y1="495" x2="476" y2="495" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="485" font-size="15" text-anchor="middle" >ComplianceOverview [requirements + files + feedback]</text><rect x="395" y="581" width="1190" height="32" fill="#fffdf3" stroke="#d9d7c8"/><text x="408" y="602" font-size="13" text-anchor="start" >POST .../compliance/requirements/{id}/upload-and-submit; one transaction</text><rect x="470" y="641" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="683" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="725" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="646" x2="476" y2="646" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="636" font-size="15" text-anchor="middle" >2. Upload file and submit requirement</text><line x1="476" y1="688" x2="951" y2="688" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="678" font-size="15" text-anchor="middle" >uploadAndSubmit(order, id, body)</text><line x1="951" y1="730" x2="1416" y2="730" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="720" font-size="15" text-anchor="middle" >uploadAndSubmit(order, id, body)</text><line x1="1416" y1="772" x2="951" y2="772" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="762" font-size="15" text-anchor="middle" >ComplianceReceipt [submissionId + fileKey]</text><line x1="951" y1="814" x2="476" y2="814" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="804" font-size="15" text-anchor="middle" >ComplianceReceipt [submissionId + fileKey]</text><rect x="395" y="935" width="1190" height="32" fill="#fffdf3" stroke="#d9d7c8"/><text x="408" y="956" font-size="13" text-anchor="start" >POST .../compliance/submissions/{id}/reviews</text><rect x="470" y="995" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="1037" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="1079" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="1000" x2="476" y2="1000" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="990" font-size="15" text-anchor="middle" >3. Approve or reject with feedback</text><line x1="476" y1="1042" x2="951" y2="1042" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="1032" font-size="15" text-anchor="middle" >review(order, id, ComplianceReviewRequest)</text><line x1="951" y1="1084" x2="1416" y2="1084" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="1074" font-size="15" text-anchor="middle" >review(order, id, ComplianceReviewRequest)</text><line x1="1416" y1="1126" x2="951" y2="1126" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="1116" font-size="15" text-anchor="middle" >ComplianceReceipt [review recorded]</text><line x1="951" y1="1168" x2="476" y2="1168" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="1158" font-size="15" text-anchor="middle" >ComplianceReceipt [review recorded]</text><rect x="395" y="1289" width="1190" height="32" fill="#fffdf3" stroke="#d9d7c8"/><text x="408" y="1310" font-size="13" text-anchor="start" >POST .../compliance/clearances; default authority procedure may be created</text><rect x="470" y="1349" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="1391" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="1433" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="1354" x2="476" y2="1354" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="1344" font-size="15" text-anchor="middle" >4. Clear selected phase</text><line x1="476" y1="1396" x2="951" y2="1396" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="1386" font-size="15" text-anchor="middle" >clear(order, ComplianceClearanceRequest)</text><line x1="951" y1="1438" x2="1416" y2="1438" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="1428" font-size="15" text-anchor="middle" >clear(order, ComplianceClearanceRequest)</text><line x1="1416" y1="1480" x2="951" y2="1480" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="1470" font-size="15" text-anchor="middle" >ComplianceReceipt [clearance recorded]</text><line x1="951" y1="1522" x2="476" y2="1522" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="1512" font-size="15" text-anchor="middle" >ComplianceReceipt [clearance recorded]</text><rect x="470" y="1628" width="12" height="177" fill="#87d3f4" stroke="#455d6a"/><rect x="945" y="1670" width="12" height="91" fill="#87d3f4" stroke="#455d6a"/><rect x="1410" y="1712" width="12" height="51" fill="#87d3f4" stroke="#455d6a"/><line x1="115" y1="1633" x2="476" y2="1633" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="295.5" y="1623" font-size="15" text-anchor="middle" >5. Read blockers and latest feedback</text><line x1="476" y1="1675" x2="951" y2="1675" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="713.5" y="1665" font-size="15" text-anchor="middle" >overview(order, phase, page, size, false)</text><line x1="951" y1="1717" x2="1416" y2="1717" stroke="#26343d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1183.5" y="1707" font-size="15" text-anchor="middle" >overview(order, phase, page, size, false)</text><line x1="1416" y1="1759" x2="951" y2="1759" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1183.5" y="1749" font-size="15" text-anchor="middle" >ComplianceOverview [not cleared + reasons]</text><line x1="951" y1="1801" x2="476" y2="1801" stroke="#26343d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="713.5" y="1791" font-size="15" text-anchor="middle" >ComplianceOverview [not cleared + reasons]</text><text x="45" y="1954" font-size="14" text-anchor="start" >Apply independently to PRE_EXPORT, ARRIVAL and QUARANTINE_RELEASE. Customer can read feedback and resubmit.</text><text x="45" y="1980" font-size="12" text-anchor="start" fill="#5b6c77">UI view names are conceptual boundaries; Controller / Service names and methods follow the Backend source.</text></g></svg>