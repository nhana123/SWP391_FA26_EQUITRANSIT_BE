spring:
  application:
    name: equitransit-backend
  datasource:
    url: ${EQ_DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=EquiTransit;encrypt=true;trustServerCertificate=true;integratedSecurity=true}
    username: ${EQ_DB_USERNAME:}
    password: ${EQ_DB_PASSWORD:}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 10000
      connection-init-sql: >-
        SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; SET ANSI_PADDING ON;
        SET ANSI_WARNINGS ON; SET CONCAT_NULL_YIELDS_NULL ON;
        SET ARITHABORT ON; SET NUMERIC_ROUNDABORT OFF;
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${EQ_SMTP_HOST:localhost}
    port: ${EQ_SMTP_PORT:587}
    username: ${EQ_SMTP_USERNAME:}
    password: ${EQ_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  address: ${EQ_BIND_ADDRESS:127.0.0.1}
  port: ${EQ_PORT:8080}
app:
  geocoding:
    search-url: ${EQ_NOMINATIM_SEARCH_URL:https://nominatim.openstreetmap.org/search}
    user-agent: ${EQ_NOMINATIM_USER_AGENT:EquiTransit-Address/1.0}
  storage:
    directory: ${EQ_STORAGE_DIRECTORY:storage/uploads/documents}
  jwt:
    secret: ${EQ_JWT_SECRET:dGVzdC1vbmx5LWtleS1mb3ItZXF1aXRyYW5zaXQtYXV0aC10ZXN0cw==}
    issuer: equitransit
    ttl-seconds: 900
    refresh-ttl-seconds: 28800
    refresh-cookie-name: eq_refresh_token
    refresh-cookie-secure: ${EQ_REFRESH_COOKIE_SECURE:false}
  mail:
    mode: ${EQ_MAIL_MODE:file}
    from: ${EQ_MAIL_FROM:no-reply@example.invalid}
    outbox: .local/outbox
  frontend-url: ${EQ_FRONTEND_URL:http://localhost:5173}
  cors-origin: ${EQ_CORS_ORIGIN:http://localhost:5173}
