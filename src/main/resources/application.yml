spring:
  application:
    name: equitransit-backend
  datasource:
    url: ${EQ_DB_URL:jdbc:sqlserver://DESKTOP-9VRARFD:1433;databaseName=EquiTransit;encrypt=true;trustServerCertificate=false}
    username: ${EQ_DB_USERNAME:}
    password: ${EQ_DB_PASSWORD:}
    hikari:
      connection-init-sql: >-
        SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; SET ANSI_PADDING ON;
        SET ANSI_WARNINGS ON; SET CONCAT_NULL_YIELDS_NULL ON;
        SET ARITHABORT ON; SET NUMERIC_ROUNDABORT OFF;
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${EQ_MAIL_HOST:${EQ_SMTP_HOST:smtp.gmail.com}}
    port: ${EQ_MAIL_PORT:${EQ_SMTP_PORT:587}}
    username: ${EQ_MAIL_USERNAME:${EQ_SMTP_USERNAME:}}
    password: ${EQ_MAIL_PASSWORD:${EQ_SMTP_PASSWORD:}}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  address: ${EQ_BIND_ADDRESS:127.0.0.1}
  port: ${EQ_PORT:8080}
app:
  auth:
    request-limit: ${EQ_AUTH_ACCOUNT_REQUEST_LIMIT:10}
    otp-secret: ${EQ_OTP_SECRET:${app.jwt.secret}}
  geocoding:
    search-url: ${EQ_NOMINATIM_SEARCH_URL:https://nominatim.openstreetmap.org/search}
    user-agent: ${EQ_NOMINATIM_USER_AGENT:EquiTransit-Address/1.0}
  storage:
    directory: ${EQ_STORAGE_DIRECTORY:storage/uploads/documents}
  jwt:
    secret: ${EQ_JWT_SECRET}
    issuer: equitransit
    ttl-seconds: 900
    refresh-ttl-seconds: 28800
    refresh-cookie-name: eq_refresh_token
    refresh-cookie-secure: ${EQ_REFRESH_COOKIE_SECURE:false}
  mail:
    worker-enabled: ${EQ_ACCOUNT_MAIL_WORKER_ENABLED:true}
    poll-ms: ${EQ_ACCOUNT_MAIL_POLL_MS:5000}
    outbox-secret: ${EQ_MAIL_OUTBOX_SECRET:${app.jwt.secret}}
    mode: ${EQ_MAIL_MODE:file}
    from: ${EQ_MAIL_FROM:no-reply@equitransit.local}
    outbox: .local/outbox
  frontend-url: ${EQ_FRONTEND_URL:http://localhost:5173}
  cors-origin: ${EQ_CORS_ORIGIN:http://localhost:5173}
